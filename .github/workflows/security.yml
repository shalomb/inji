name: Security Checks

on:
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security checks weekly on Mondays at 10:00 UTC
    - cron: '0 10 * * 1'

# Least privilege: these jobs only read the repo. Nothing here writes to it.
permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: make sync

    - name: Install security tools
      run: uv sync --extra security

    # Accepted risk, revisit when nltk publishes a release newer than 3.10.3
    # (drop this ignore and the safety one below together):
    # PYSEC-2026-3740 (CVE-2026-81726) is a path traversal in nltk model save/load
    # helpers (TransitionParser, AveragedPerceptron, PerceptronTagger). No fix exists
    # upstream. nltk is a transitive dependency of `safety` (the `security` extra) and is
    # never installed for users of inji. inji does not import it, and safety only uses nltk.edit_distance.
    # The previous ignores (PYSEC-2026-89, -97, PYSEC-2024-277) no longer match anything.
    - name: Run pip-audit for vulnerability scanning
      run: |
        uv run pip-audit --desc \
          --ignore-vuln PYSEC-2026-3740

    # Same accepted risk as above (CVE-2026-81726), under safety's own ID.
    - name: Check for known security issues with safety
      run: uv run safety check --json --ignore SFTY-20260902-58666

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Dependency Review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: moderate
