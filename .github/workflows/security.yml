name: Security Checks

on:
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security checks weekly on Mondays at 10:00 UTC
    - cron: '0 10 * * 1'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: make sync

    - name: Install security tools
      run: uv sync --extra security

    # PYSEC-2026-3740 (GHSA-8mgp-746c-j5xp): nltk pathsec bypass, no patched
    # release yet. nltk is only a transitive dep of the `safety` dev extra and
    # is never imported by inji. Remove once nltk ships a fix.
    - name: Run pip-audit for vulnerability scanning
      run: |
        uv run pip-audit --desc \
          --ignore-vuln PYSEC-2026-89 \
          --ignore-vuln PYSEC-2026-97 \
          --ignore-vuln PYSEC-2024-277 \
          --ignore-vuln PYSEC-2026-3740

    - name: Check for known security issues with safety
      run: uv run safety check --json

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Dependency Review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: moderate
        # nltk is dev-only (via safety) and unpatched; see pip-audit note above.
        allow-ghsas: GHSA-8mgp-746c-j5xp
